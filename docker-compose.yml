services:
  postgres:
    image: postgres:16-alpine
    container_name: ua-copilot-postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate copilot_test database used by Vitest, so tests never touch dev data.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
